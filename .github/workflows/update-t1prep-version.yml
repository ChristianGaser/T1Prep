name: Bump T1Prep version

# Bumps __version__ on main *before* a release, for releasing from the GitHub
# web UI: run this with the new version, then create the release from main.
# (Locally, `make release VERSION=x.y.z` does the same and tags as well.)
#
# It used to run on the release event, i.e. after the tag had been created,
# so the tag kept the old version: v0.8.0 contained 0.7.9 and its PyPI upload
# failed.  "Publish to PyPI" now refuses a tag that differs from __version__.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "New version (e.g., v0.8.1 or 0.8.1)"
        required: true

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Determine version from tag
        id: get_version
        env:
          RAW_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${RAW_TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-]?[A-Za-z0-9]+)*$ ]]; then
            echo "::error::'$RAW_TAG' is not a version like 0.8.1." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Update version in src/t1prep/__init__.py
        # src/t1prep/__init__.py is the single source of truth for the version.
        # Everything else derives from it automatically: pyproject.toml via
        # setuptools.dynamic, the bash scripts awk it from here at runtime, and
        # the Dockerfile ARG is pinned by the separate "Update Dockerfile"
        # workflow once PyPI has the release.
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail
          FILE='src/t1prep/__init__.py'
          echo "Updating $FILE to version $VERSION"
          sed -i -E "s/^__version__ = \"[^\"]*\"/__version__ = \"${VERSION}\"/" "$FILE"
          if ! grep -qE "^__version__ = \"${VERSION}\"" "$FILE"; then
            echo "::error::Failed to set __version__ to ${VERSION} in $FILE" >&2
            exit 1
          fi

      - name: Commit and push changes
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit. Version is already ${VERSION}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/t1prep/__init__.py
          git commit -m "chore: bump T1Prep version to ${VERSION}"

          # Someone may push to main in the meantime; rebase-and-retry so a
          # concurrent push doesn't fail the bump.
          n=0
          until git push origin HEAD:main; do
            n=$((n + 1))
            if [ "$n" -ge 5 ]; then
              echo "::error::push to main failed after $n attempts" >&2
              exit 1
            fi
            echo "push rejected; rebasing on latest main and retrying ($n)…"
            git pull --rebase origin main
            sleep $((RANDOM % 4 + 1))
          done
