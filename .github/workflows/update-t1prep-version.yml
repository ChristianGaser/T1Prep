name: Update T1Prep version on release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to use as version (e.g., v0.2.4 or 0.2.4)"
        required: false

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Determine version from tag
        id: get_version
        run: |
          # Prefer explicit input for manual runs, else use release tag_name
          RAW_TAG="${{ github.event.release.tag_name }}"
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            RAW_TAG="${{ github.event.inputs.tag }}"
          fi

          if [ -z "$RAW_TAG" ]; then
            echo "::error::No tag found. Provide 'tag' input for workflow_dispatch or trigger from a Release." >&2
            exit 1
          fi

          # Strip leading 'v' if present, keep only numeric semantic version (e.g., 1.2.3)
          VERSION="${RAW_TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::warning::Tag '$RAW_TAG' does not look like a semantic version. Using '$VERSION' as-is."
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Update version in src/t1prep/__init__.py
        # src/t1prep/__init__.py is the single source of truth for the version.
        # Everything else derives from it automatically: pyproject.toml via
        # setuptools.dynamic, the bash scripts awk it from here at runtime, and
        # the Dockerfile ARG is pinned by the separate "Update Dockerfile"
        # workflow.  So this is the only file this workflow needs to edit.
        run: |
          set -euo pipefail
          VERSION='${{ steps.get_version.outputs.version }}'
          FILE='src/t1prep/__init__.py'

          if [ ! -f "$FILE" ]; then
            echo "::error::File $FILE not found" >&2
            exit 1
          fi

          echo "Updating $FILE to version $VERSION"
          sed -i -E "s/^__version__ = \"[^\"]*\"/__version__ = \"${VERSION}\"/" "$FILE"

          if ! grep -qE "^__version__ = \"${VERSION}\"" "$FILE"; then
            echo "::error::Failed to set __version__ to ${VERSION} in $FILE" >&2
            exit 1
          fi

      - name: Commit and push changes
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit. Version may already be ${VERSION}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/t1prep/__init__.py
          git commit -m "chore: bump T1Prep version to ${VERSION}"

          # The "Update Dockerfile" workflow may push to main on the same
          # release event; rebase-and-retry so concurrent pushes don't fail.
          n=0
          until git push origin HEAD:main; do
            n=$((n + 1))
            if [ "$n" -ge 5 ]; then
              echo "::error::push to main failed after $n attempts" >&2
              exit 1
            fi
            echo "push rejected; rebasing on latest main and retrying ($n)…"
            git pull --rebase origin main
            sleep $((RANDOM % 4 + 1))
          done
