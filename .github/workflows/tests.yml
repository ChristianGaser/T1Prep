name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    # ubuntu-latest is Ubuntu 26.04 since November 2026, for which
    # actions/setup-python has no 3.9 (end of life since October 2025): that
    # one job stays on 24.04.
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is supported (pinned to PyTorch 2.8 via the conditional torch
        # requirement); 3.10-3.14 use PyTorch 2.9+.  Keep this list in sync with
        # the classifiers in pyproject.toml.  3.14 needs a cat-surf release
        # with cp314 wheels (> 1.0.32) on PyPI.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the libraries Qt loads
        # The PySide6 wheels bundle Qt but link these system libraries; the
        # Ubuntu 26.04 image lacks at least libEGL.so.1, so every test that
        # opens a window or imports a viewer fails at "from PySide6 import
        # QtGui".  The list is libQt6Gui's NEEDED entries outside the wheel.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libx11-6 libxkbcommon0 \
            libfontconfig1 libfreetype6 libdbus-1-3

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install T1Prep (CPU PyTorch)
        # The PyTorch CPU wheel index keeps the download small and avoids CUDA
        # packages the runner cannot use.  The conditional torch pin in
        # pyproject.toml selects 2.8 on 3.9 and 2.9.1+ from 3.10 on automatically.
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu .

      - name: Byte-compile sources
        run: python -m compileall -q src

      - name: Import smoke test
        # The package imports its parts on first use, so utils (torch,
        # nibabel, ...) and cat_surf are named: a bare "import t1prep" would
        # pass without them.
        run: python -c "import t1prep, t1prep.utils, t1prep.cat_surf; print('t1prep', t1prep.__version__, 'OK')"

      - name: Run test suite
        run: |
          pip install pytest
          pytest -q
