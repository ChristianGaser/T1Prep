name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_pypi:
        description: "Publish to TestPyPI instead of PyPI"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that the release tag matches __version__
        # The tag is what gets built, so the version has to be bumped before
        # tagging (make release VERSION=x.y.z).  v0.8.0 was tagged first and
        # bumped afterwards: this job rebuilt 0.7.9 and PyPI rejected it.
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version=$(sed -n -E 's/^__version__ = "([^"]+)".*/\1/p' src/t1prep/__init__.py)
          if [ "${TAG#v}" != "${version}" ]; then
            echo "::error::Release tag ${TAG} does not match __version__ = \"${version}\" in src/t1prep/__init__.py. Bump the version before tagging (make release VERSION=${TAG#v}), then recreate the release." >&2
            exit 1
          fi
          echo "Tag ${TAG} matches __version__ ${version}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event_name == 'release' || github.event.inputs.test_pypi == 'false') && 'pypi' || 'testpypi' }}
      url: ${{ (github.event_name == 'release' || github.event.inputs.test_pypi == 'false') && 'https://pypi.org/p/T1Prep' || 'https://test.pypi.org/p/T1Prep' }}
    permissions:
      id-token: write # Required for trusted publishing (OIDC)

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        if: github.event.inputs.test_pypi == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: github.event_name == 'release' || github.event.inputs.test_pypi == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
