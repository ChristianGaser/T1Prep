name: Update Dockerfile

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag/version to pin (e.g., v0.5.3 or 0.5.3)"
        required: true
  # Pin only what PyPI really has: after a successful "Publish to PyPI" run
  # that a release triggered.  Pinning on the release event itself pinned
  # 0.8.0 although its upload had failed, which broke `docker build .`.
  workflow_run:
    workflows: ["Publish to PyPI"]
    types: [completed]

permissions:
  contents: write

jobs:
  bump-dockerfile:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'release')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Determine version from tag
        id: get_version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          # For a run triggered by a release, head_branch is the release tag
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          RAW_TAG="${INPUT_TAG:-${RUN_TAG:-}}"
          if [ -z "$RAW_TAG" ]; then
            echo "::error::No tag found. Provide 'tag' input for workflow_dispatch." >&2
            exit 1
          fi

          # pip expects a bare PEP 440 version (no leading 'v') for the
          # "T1Prep==${T1PREP_VERSION}" install in the Dockerfile.
          VERSION="${RAW_TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*([.-]?[A-Za-z0-9]+)*$ ]]; then
            echo "::error::'$RAW_TAG' is not a version tag." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Pin version in Dockerfile
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "s/^ARG T1PREP_VERSION=.*/ARG T1PREP_VERSION=${VERSION}/" Dockerfile
          if ! grep -qE "^ARG T1PREP_VERSION=${VERSION}$" Dockerfile; then
            echo "::error::Failed to pin T1PREP_VERSION to ${VERSION} in Dockerfile" >&2
            exit 1
          fi

      - name: Commit and push changes
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No Dockerfile changes; already pinned to ${VERSION}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile
          git commit -m "chore: pin Dockerfile T1PREP_VERSION to ${VERSION}"

          # Someone may push to main in the meantime; rebase-and-retry so a
          # concurrent push doesn't fail the pin.
          n=0
          until git push origin HEAD:main; do
            n=$((n + 1))
            if [ "$n" -ge 5 ]; then
              echo "::error::push to main failed after $n attempts" >&2
              exit 1
            fi
            echo "push rejected; rebasing on latest main and retrying ($n)…"
            git pull --rebase origin main
            sleep $((RANDOM % 4 + 1))
          done
